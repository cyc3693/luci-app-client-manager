name: Build OpenWrt APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout package
        uses: actions/checkout@v6
        with:
          path: feed/luci-app-client-manager
          fetch-depth: 0

      - name: Build package
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: x86_64-25.12.5
          FEEDNAME: custom
          FEED_DIR: ${{ github.workspace }}/feed
          PACKAGES: luci-app-client-manager
          NO_REFRESH_CHECK: true
          V: s

      - name: Show generated packages
        run: |
          echo "=== Built packages ==="
          find bin -type f -name '*.apk' -print

      - name: Prepare APK
        run: |
          mkdir -p dist
          find bin/packages -type f \
            -name 'luci-app-client-manager-*.apk' \
            -exec cp {} dist/ \;

          echo "=== Final APK ==="
          ls -lh dist/

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: luci-app-client-manager-openwrt-25.12.5
          path: dist/*.apk